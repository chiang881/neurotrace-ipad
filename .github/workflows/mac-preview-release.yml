name: Mac Preview Release

on:
  push:
    tags:
      - "mac-preview-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example mac-preview-v1.1.0"
        required: true
        default: "mac-preview-v1.1.0"

permissions:
  contents: write

concurrency:
  group: mac-preview-release-${{ github.ref }}-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Mac preview
    runs-on: macos-26
    timeout-minutes: 30

    env:
      APP_NAME: neurotrace
      PRODUCT_NAME: neurotrace-Mac-Preview
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-MacPreview
      OUTPUT_DIR: ${{ github.workspace }}/release-artifacts
      REQUESTED_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          elif [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          else
            echo "Xcode 26.5 or newer is required." >&2
            exit 1
          fi
          xcodebuild -version

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${REQUESTED_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^mac-preview-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag: ${release_tag}" >&2
            exit 1
          fi
          release_version="${release_tag#mac-preview-v}"
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project neurotrace.xcodeproj \
            -scheme neurotrace \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build Apple Silicon Mac Catalyst preview
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -quiet \
            -project neurotrace.xcodeproj \
            -scheme neurotrace \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Sign and package preview
        shell: bash
        run: |
          set -euo pipefail
          app_path="${DERIVED_DATA}/Build/Products/Release-maccatalyst/${APP_NAME}.app"
          archive_name="${PRODUCT_NAME}-${RELEASE_VERSION}-arm64.app.zip"
          if [[ ! -d "${app_path}" ]]; then
            echo "Built app not found: ${app_path}" >&2
            exit 1
          fi
          mkdir -p "${OUTPUT_DIR}"
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${app_path}" \
            "${OUTPUT_DIR}/${archive_name}"
          cd "${OUTPUT_DIR}"
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: neurotrace-Mac-Preview-${{ env.RELEASE_VERSION }}-arm64
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/mac-preview-release-notes.md"
          printf '%s\n' \
            "neurotrace ${RELEASE_VERSION} · Apple Silicon Mac Catalyst 预览构建。" \
            '' \
            '- 品牌、工程、target、scheme 与目录统一为 neurotrace。' \
            '- README 品牌图标升级为代码生成的透明 superellipse 边框。' \
            '- 项目采用 MIT License。' \
            '' \
            '仅供神经行为研究与界面预览，不构成医学诊断或筛查结论。' \
            > "${notes_file}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-artifacts/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "neurotrace Mac 预览版 ${RELEASE_VERSION}" \
              --notes-file "${notes_file}" \
              --prerelease=false \
              --latest
          else
            gh release create "${RELEASE_TAG}" release-artifacts/* \
              --target "${GITHUB_SHA}" \
              --title "neurotrace Mac 预览版 ${RELEASE_VERSION}" \
              --notes-file "${notes_file}" \
              --latest
          fi
